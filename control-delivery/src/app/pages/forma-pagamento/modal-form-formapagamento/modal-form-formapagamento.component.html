<div class="container-fluid p-3">
    <mat-icon (click)="closeModal()" class="float-end hover">close</mat-icon>

    <form class="row" [formGroup]="formPG">
        <div class="col-12 col-md-6 mb-2">
            <mat-form-field class="example-full-width w-100">
                <mat-label>Nome</mat-label>
                <input type="text" matInput formControlName="descricao" placeholder="Digite o nome">
                @if (formPG.controls['descricao'].invalid) {
                <mat-error>Por favor digite um nome válido</mat-error>
                }
            </mat-form-field>
        </div>

        <div class="col-12 col-md-6 mb-2">
            <mat-checkbox class="example-margin" formControlName="ativo" [checked]="formPG.controls['ativo'].value"
                (change)="atualizarLabel()">
                {{ labelAtivo }}
            </mat-checkbox>
        </div>
        <div class="col-12 col-md-12 mb-2 ">
            <button type="button" class="botao-primario float-end" [disabled]="!formPG.valid" (click)="savePG()">
                Salvar
            </button>
        </div>
    </form>
</div>
