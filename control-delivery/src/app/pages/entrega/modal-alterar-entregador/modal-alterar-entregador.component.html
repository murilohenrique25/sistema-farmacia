<div class="container-fluid p-3">
    <mat-icon (click)="closeModal()" class="float-end hover">close</mat-icon>

    <h1 class="title">Selecione o entregador</h1>

    <h3 class="obs">Atenção: ao alterar o entregador, os dados vinculados ao entregador anterior serão perdidos.</h3>

    <div class="col-12">
        <mat-form-field class="w-100">
            <mat-label>Entregador</mat-label>
            <mat-select name="entregador" [(ngModel)]="idEntregador">
                @for (entregador of listEntregador; track entregador) {
                <mat-option [value]="entregador.idEntregador">{{entregador.nome}}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    </div>
    <div class="flex col-12 buttons">
        <div class="col-12">
            <app-button (click)="alterarEntrega()" textButton="Atribuir"></app-button>
        </div>
    </div>
</div>
